name: backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora-ai
      POSTGRES_PASSWORD: nexora-ai
      POSTGRES_DB: nexora-ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora-ai -d nexora-ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PROJECT_NAME: Nexora AI
      DATABASE_URL: postgresql://nexora-ai:nexora-ai@postgres:5432/nexora-ai
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      HF_TUTOR_MODEL: ${HF_TUTOR_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      HF_TUTOR_TOKEN: ${HF_TUTOR_TOKEN:-}
      HF_WELLBEING_MODEL: ${HF_WELLBEING_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      HF_WELLBEING_TOKEN: ${HF_WELLBEING_TOKEN:-}
      HF_SCHEDULER_MODEL: ${HF_SCHEDULER_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      HF_SCHEDULER_TOKEN: ${HF_SCHEDULER_TOKEN:-}
      HF_SPEECH_TOKEN: ${HF_SPEECH_TOKEN:-}
      HF_TTS_TOKEN: ${HF_TTS_TOKEN:-}
      HF_EMBEDDING_TOKEN: ${HF_EMBEDDING_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
