services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora-ai
      POSTGRES_PASSWORD: nexora-ai
      POSTGRES_DB: nexora-ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora-ai -d nexora-ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: